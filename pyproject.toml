[project]
name = "research-scan"
version = "0.5.2"
description = "Research Scan finds and verifies the 5–10 recent papers that matter most for a research question, project, or decision."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Andrej Nabergoj" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
    "rapidfuzz>=3",
    "pyyaml>=6",
    # MCP is a first-class surface, so its server ships by default. Exact pins: the transport is
    # measured against one FastMCP release, and a silent minor bump would move that surface.
    "fastmcp==3.4.7",
    "uvicorn==0.52.4",
]

[project.scripts]
research-scan = "research_scan.cli:app"
research-scan-mcp = "research_scan.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Synectic-Research/research-scan"
Documentation = "https://researchscan.synectic.org"
Repository = "https://github.com/Synectic-Research/research-scan"
Changelog = "https://github.com/Synectic-Research/research-scan/blob/main/CHANGELOG.md"
Issues = "https://github.com/Synectic-Research/research-scan/issues"

[project.optional-dependencies]
# Deprecated compatibility extra.
# MCP support is now included by default.
mcp = []

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_scan"]

# The sdist otherwise takes everything git tracks, and `research/experiments/` is tracked on
# purpose (see its README). Committed evidence must not become a 20MB payload on PyPI: the
# wheel never saw it — `packages` above is a whitelist — but the sdist would.
[tool.hatch.build.targets.sdist]
exclude = ["research/experiments/"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real network (doctor); deselected unless -m live"]
