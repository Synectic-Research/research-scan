name: release

# Publishing is tag-only, structurally. `workflow_dispatch` exists so the build job can be
# exercised against any ref, but every publishing job is gated on
# `github.event_name == 'push'` as well as the tag prefix — so dispatching this workflow
# against a tag still cannot publish. Dispatch is the dry run; there is no flag to flip.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install the locked dependency set
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest

      # Four files carry the version, and a release that moves only some of them ships a
      # package whose plugin manifest, citation record or registry entry disagrees with the
      # wheel. On a tag, the tag is a fifth claim and has to agree too. The failure names the
      # file so the fix is obvious without reading the log twice.
      - name: Versions must agree across all four files
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python3 scripts/check_versions.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/check_versions.py
          fi

      - name: Build
        run: uv build

      # The repo passing its own tests is not evidence the artifact works. Install the wheel
      # somewhere that has none of the source tree on the path, then make it state its own
      # version twice — once through the CLI, once through the MCP handshake a client reads.
      # On a tag the step above has already tied pyproject to the tag, so agreeing with
      # pyproject here is agreeing with the tag.
      - name: Smoke-test the built wheel
        run: |
          expected="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet --upgrade pip
          /tmp/smoke/bin/pip install --quiet dist/*.whl

          cli_version="$(/tmp/smoke/bin/research-scan --version)"
          echo "expected:            ${expected}"
          echo "wheel CLI reports:   ${cli_version}"
          if [ "${cli_version}" != "${expected}" ]; then
            echo "::error title=Wheel version mismatch::installed wheel reports ${cli_version}, expected ${expected}"
            exit 1
          fi

          handshake='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}'
          server_version="$(printf '%s\n' "${handshake}" \
            | /tmp/smoke/bin/research-scan mcp 2>/dev/null \
            | head -1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["serverInfo"]["version"])')"
          echo "wheel MCP reports:   ${server_version}"
          if [ "${server_version}" != "${expected}" ]; then
            echo "::error title=MCP serverInfo version mismatch::stdio handshake reports ${server_version}, expected ${expected}"
            exit 1
          fi

      # One builder, shared with local hands, so a CI asset and a locally built asset of the
      # same ref are byte-identical. The hashes go to the summary because they are the thing
      # anyone verifying a download compares against.
      # `dist-assets/` holds the archives and nothing else, and the manifest is written outside
      # it, because the upload and both attestations cover that directory and would treat a
      # manifest sitting in it as a release asset. It is kept out of `dist/` for the mirror-image
      # reason: that is the directory `publish-pypi` hands to twine, which rejects a stray file.
      - name: Build the plugin and skill archives
        run: |
          uv run python scripts/build_plugin_assets.py --ref "${GITHUB_SHA}" \
            --out dist-assets --manifest release-manifest/release-assets-manifest.json
          {
            echo "### Release archives"
            echo
            echo '```'
            (cd dist-assets && sha256sum ./*)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-assets
          path: dist-assets/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest/
          if-no-files-found: error

  publish-pypi:
    needs: build
    # Tag pushes only. The event check is what makes this unreachable from
    # workflow_dispatch even when someone dispatches against a tag ref.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only credential this job gets. There is no API token anywhere in this
      # workflow or in the repository's secrets: PyPI Trusted Publishing exchanges
      # this short-lived OIDC token for an upload token at publish time.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release:
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-assets
          path: dist-assets/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: release-manifest/

      # Provenance ties each archive to this workflow, this repository and this commit, so a
      # download can be checked against something other than trust in the uploader.
      - name: Attest the skill archive
        id: attest-skill
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-assets/research-scan-skill-*.skill

      - name: Attest the plugin archive
        id: attest-plugin
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-assets/research-scan-plugin-*.zip

      - name: Record the attestation URLs
        env:
          SKILL_ATTESTATION: ${{ steps.attest-skill.outputs.attestation-url }}
          PLUGIN_ATTESTATION: ${{ steps.attest-plugin.outputs.attestation-url }}
        run: |
          {
            echo "### Provenance attestations"
            echo
            echo "- skill: ${SKILL_ATTESTATION}"
            echo "- plugin: ${PLUGIN_ATTESTATION}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # CHANGELOG.md is the single source of release notes. A missing section is a failure
      # rather than an empty release body: shipping a release nobody described is worse than
      # not shipping it.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          start = next(
              (i for i, line in enumerate(lines) if re.match(rf"^## \[{re.escape(version)}\]", line)),
              None,
          )
          if start is None:
              print(
                  f"::error title=Missing changelog section::CHANGELOG.md has no '## [{version}]' "
                  f"section. Add one and retag; release notes are generated, never hand-written."
              )
              sys.exit(1)

          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## [")),
              len(lines),
          )
          body = "\n".join(lines[start + 1 : end]).strip()
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      # PyPI is canonical for the wheel and sdist, so dist/ is deliberately not attached here.
      # The Release carries only what PyPI cannot: the skill bundle and the plugin archive.
      # The manifest names what may be published, so the upload list is read from it rather
      # than spelled twice. The assertion above it is the other half of the same contract: the
      # build directory must hold the manifest's set exactly, or nothing is uploaded at all.
      # The manifest names what may be published, so the upload list is read from it rather
      # than spelled twice. The assertion below is the other half of the same contract: the
      # build directory must hold the manifest's set exactly, or nothing is uploaded at all.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: release-manifest/release-assets-manifest.json
        run: |
          mapfile -t names < <(python3 -c "import json,sys; print('\n'.join(e['name'] for e in json.load(open(sys.argv[1]))['assets']))" "${MANIFEST}")
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error title=Empty manifest::the manifest names no assets"
            exit 1
          fi
          expected="$(printf '%s\n' "${names[@]}" | sort)"
          present="$(cd dist-assets && ls -1 | sort)"
          if [ "${present}" != "${expected}" ]; then
            echo "::error title=Build directory does not match the manifest::dist-assets/ must hold exactly the files the manifest names"
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${present}") || true
            exit 1
          fi
          paths=()
          for name in "${names[@]}"; do paths+=("dist-assets/${name}"); done
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${version}" \
            --notes-file release-notes.md \
            "${paths[@]}"

      # What GitHub serves is not automatically what the job built. Fetch both assets back
      # from the public release and compare hashes before calling the release done.
      # What GitHub serves is not automatically what the job built. Fetch every asset back and
      # check it against the manifest — both directions, so a missing asset and an unexpected
      # one are each a failure, and a file the manifest does not name is simply not its business.
      - name: Verify the published assets round-trip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p roundtrip
          gh release download "${GITHUB_REF_NAME}" --dir roundtrip --clobber
          python3 scripts/verify_release_assets.py \
            --manifest release-manifest/release-assets-manifest.json \
            --built dist-assets \
            --downloaded roundtrip

      # The Ed25519 domain key that signs the registry publish is deliberately not in GitHub
      # secrets, so this last step cannot be automated without weakening that. The weekly
      # drift check catches it if it is forgotten.
      - name: Remind the operator to publish to the MCP registry
        run: |
          {
            echo "### MANUAL STEP REMAINING"
            echo
            echo '```bash'
            echo 'mcp-publisher login dns -domain synectic.org -private-key <ed25519-key-hex> && mcp-publisher publish'
            echo '```'
            echo
            echo "Registry publish is deliberately not automated: the Ed25519 domain key never"
            echo "enters GitHub secrets, CI, or the repository. See RELEASING.md."
          } >> "${GITHUB_STEP_SUMMARY}"
